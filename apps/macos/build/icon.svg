<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bogen's mark (apps/editor/public/icons/icon.svg) on the macOS app icon grid: an 824 px body centred in 1024,
       continuous-corner rectangle, soft drop shadow as Apple's template draws it. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f6f1"/>
      <stop offset="1" stop-color="#ebe8df"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#body)" filter="url(#shadow)"/>
  <g transform="translate(512 512) scale(5.1) translate(-51 -50)">
    <path fill="#2b3df2" d="M10 4H66L92 30V96H10Z"/>
    <path fill="#1b27a8" d="M66 4V30H92Z"/>
    <path d="M26 48 48 64 26 80" fill="none" stroke="#f4f2ec" stroke-width="10.5" stroke-miterlimit="8"/>
    <rect fill="#f4f2ec" x="55" y="73" width="25" height="10.5"/>
  </g>
</svg>
